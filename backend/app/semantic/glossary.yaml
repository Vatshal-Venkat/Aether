# The glossary — Aether's small "semantic layer".
# Plain English: a dictionary the AI reads before writing SQL, so that everyone means the
# same thing by "HbA1c", "active medication" or "what insurance paid". Edit freely: no code change needed.

tables:
  # --- clinical_db (PostgreSQL) ---
  patients: One row per (fake) person — name, birth/death date, gender, race, address, lifetime healthcare expenses.
  encounters: One row per visit (wellness check, emergency, inpatient stay...). Links patient, provider, organization and payer.
  conditions: Diagnoses a patient has had (e.g. diabetes, hypertension), with start and stop dates.
  observations: Measurements and lab results (vital signs, blood tests, survey scores), one value per row.
  medications: Prescriptions — drug, start/stop dates, cost, what insurance covered, reason.
  procedures: Procedures performed during visits (tests, surgeries, therapies) with cost.
  immunizations: Vaccines given, with date and cost.
  allergies: Allergies and intolerances, with reaction and severity.
  careplans: Care plans (e.g. diabetes self-management) with reason and dates.
  devices: Medical devices assigned to the patient (e.g. glucose monitor).
  imaging_studies: Imaging (X-ray, CT...) with body site and modality.
  supplies: Medical supplies used during visits.
  # --- billing_db (MySQL) ---
  organizations: Hospitals and clinics — name, address, revenue, utilization.
  providers: Doctors and clinicians — name, speciality, organization they work for.
  payers: Insurance companies (and NO_INSURANCE) — totals covered and uncovered.
  payer_transitions: Which insurer covered which patient, over which date range.
  claims: One insurance claim per billed service, with diagnosis codes and outstanding balances.
  claims_transactions: Line items of claims — charges, payments, adjustments, transfers.

columns:
  patients.first: "First name; Synthea adds digits, e.g. 'Abe604' is the stored value. The website shows names without the digits, so people usually type them without (e.g. 'Abe Bode'): match with first LIKE 'Abe%', never first = 'Abe'."
  patients.last: "Last name, with digits, e.g. 'Bode78'. Typed without the digits: match with last LIKE 'Bode%'."
  patients.deathdate: NULL means the patient is alive.
  patients.healthcare_expenses: Lifetime healthcare spending by the patient.
  patients.healthcare_coverage: Lifetime amount covered by insurers.
  encounters.encounterclass: "Visit type: ambulatory, wellness, outpatient, emergency, urgentcare, inpatient, virtual, home, snf, hospice."
  encounters.provider: Id of the doctor — matches providers.id in billing_db.
  encounters.organization: Id of the hospital/clinic — matches organizations.id in billing_db.
  encounters.payer: Id of the insurer — matches payers.id in billing_db.
  encounters.total_claim_cost: Total billed for the visit.
  encounters.payer_coverage: Amount of the visit paid by the insurer.
  conditions.stop: NULL means the condition is ongoing.
  conditions.description: "Condition name ending with its TYPE in brackets: '(disorder)' = a real diagnosis, e.g. 'Essential hypertension (disorder)'; '(finding)' = an observation such as 'Full-time employment (finding)'; '(situation)' = an administrative state such as 'Medication review due (situation)'. For diagnoses/diseases/disorders use description LIKE '%(disorder)'."
  observations.description: "What was measured, e.g. 'Hemoglobin A1c/Hemoglobin.total in Blood', 'Systolic Blood Pressure'."
  observations.value: "Stored as TEXT. When type = 'numeric', CAST(value AS NUMERIC) before comparing or averaging."
  observations.type: "'numeric' or 'text' — says how to read value."
  observations.category: "laboratory, vital-signs, survey, social-history, exam, procedure, therapy, imaging."
  observations.units: Unit of the value (e.g. %, mg/dL, mm[Hg], kg).
  medications.description: "Drug name and strength, e.g. 'amLODIPine 2.5 MG Oral Tablet'. One ROW per prescription period: long-term drugs are renewed again and again (one patient has 222 rows of the same drug). So 'how many medications' / 'most medications' means different medicines: COUNT(DISTINCT description), not COUNT(*)."
  medications.stop: NULL means the medication is still active.
  medications.code: RxNorm drug code.
  medications.totalcost: Total cost of all dispenses of this prescription.
  medications.payer_coverage: Amount the insurer covered.
  allergies.severity1: Severity of the first listed reaction.
  claims.patientid: Id of the patient — matches patients.id in clinical_db.
  claims.providerid: Id of the doctor — matches providers.id.
  claims.outstanding1: Amount still owed by the primary insurer.
  claims.outstandingp: "Amount still owed by the patient. 'Who owes us the most' = SUM(outstandingp) per claims.patientid, keeping only totals > 0 (most balances are 0). Not patients.healthcare_expenses minus coverage."
  claims_transactions.type: "CHARGE, PAYMENT, ADJUSTMENT, TRANSFERIN, TRANSFEROUT."
  claims_transactions.amount: "Money amount of CHARGE and TRANSFERIN rows. EMPTY (NULL) on PAYMENT rows: the money paid is in claims_transactions.payments."
  claims_transactions.payments: "Amount paid, on rows with type = 'PAYMENT'."
  claims_transactions.outstanding: "Running balance of one line item. Do NOT sum it for totals owed — use claims.outstandingp (patient) or claims.outstanding1 / outstanding2 (insurers)."
  providers.speciality: Medical speciality of the provider.
  providers.name: "Doctor's full name with Synthea digits, e.g. 'Emmaline88 Witting912'. Typed without the digits ('Emmaline Witting'): match with name LIKE 'Emmaline% Witting%'."
  payers.name: Insurer name (NO_INSURANCE means uninsured).
  # Synthea's stored totals below were computed over its WHOLE simulation, not the records loaded here, and
  # they disagree with them (checked 2026-11-19). Count the real rows instead. (unique_customers does agree.)
  payers.covered_encounters: "Do not use (Synthea total that disagrees with our records). Visits an insurer paid for: count encounters rows per encounters.payer in clinical_db."
  payers.covered_medications: "Do not use (Synthea total that disagrees with our records). Count medications rows per medications.payer in clinical_db."
  payers.unique_customers: Number of distinct patients the insurer has covered (agrees with payer_transitions).
  providers.encounters: "Do not use (Synthea total that disagrees with our records). Visits per doctor: count encounters rows per encounters.provider in clinical_db."
  organizations.utilization: "Do not use (Synthea total that disagrees with our records). Visits per hospital/clinic: count encounters rows per encounters.organization in clinical_db."

terms:
  - term: HbA1c
    meaning: Average blood sugar over ~3 months, in %. 6.5% or higher suggests diabetes; above 8% is poorly controlled.
    sql_hint: "observations.description = 'Hemoglobin A1c/Hemoglobin.total in Blood', CAST(value AS NUMERIC)"
    db: clinical
  - term: blood sugar / glucose
    meaning: Glucose level in blood, mg/dL.
    sql_hint: "observations.description IN ('Glucose [Mass/volume] in Blood', 'Glucose [Mass/volume] in Serum or Plasma')"
    db: clinical
  - term: blood pressure
    meaning: Two numbers, systolic over diastolic, in mm[Hg]. 130/80 or higher is high.
    sql_hint: "observations.description IN ('Systolic Blood Pressure', 'Diastolic Blood Pressure')"
    db: clinical
  - term: cholesterol
    meaning: Total, LDL ("bad") and HDL ("good") cholesterol in mg/dL.
    sql_hint: "observations.description LIKE 'Cholesterol%'"
    db: clinical
  - term: BMI
    meaning: Body mass index (weight relative to height). 30 or more is obese.
    sql_hint: "observations.description = 'Body mass index (BMI) [Ratio]'"
    db: clinical
  - term: diabetes
    meaning: Type 2 diabetes and its complications (prediabetes is separate).
    sql_hint: "conditions.description ILIKE '%diabetes%' (exclude 'Prediabetes%' unless asked)"
    db: clinical
  - term: hypertension
    meaning: High blood pressure diagnosis.
    sql_hint: "conditions.description = 'Essential hypertension (disorder)'"
    db: clinical
  - term: active medication / current medication / currently taking / taking now
    meaning: A prescription that has not ended.
    sql_hint: "medications.stop IS NULL"
    db: clinical
  - term: ongoing condition
    meaning: A diagnosis that has not resolved.
    sql_hint: "conditions.stop IS NULL"
    db: clinical
  - term: age
    meaning: Years since birth (until death if deceased).
    sql_hint: "date_part('year', age(coalesce(deathdate, now()), birthdate))"
    db: clinical
  - term: visit
    meaning: Any encounter with the healthcare system.
    sql_hint: "encounters table; filter encounterclass for a visit type"
    db: clinical
  - term: emergency visit / emergency
    meaning: A visit whose type is emergency.
    sql_hint: "encounters.encounterclass = 'emergency'"
    db: clinical
  - term: insurer that paid for a visit / paid for a visit / paid for visits
    meaning: The insurance company recorded as the payer of each visit.
    sql_hint: "count encounters per encounters.payer (an insurer id; its name is payers.name in billing_db)"
    db: clinical
  - term: revenue / insurer revenue / insurance company revenue / hospital revenue
    meaning: The revenue figure stored for each insurance company and for each hospital or clinic (whose revenue depends on what the question is about).
    sql_hint: "insurers: payers.revenue; hospitals and clinics: organizations.revenue"
    db: billing
  - term: visit cost
    meaning: What a visit was billed, and how much the insurer paid. Use for 'how much did my visit cost'.
    sql_hint: "encounters.total_claim_cost, encounters.payer_coverage"
    db: clinical
  - term: insurance payment / amount owed
    meaning: Authoritative money questions about claims, payments and balances come from billing_db.
    sql_hint: "paid: SUM(claims_transactions.payments) WHERE type = 'PAYMENT' (amount is NULL there); still owed: claims.outstanding1 / outstandingp"
    db: billing
  - term: outstanding balance / balance / owe / owed / owes / money owed
    meaning: Money still unpaid on claims — by the patient (outstandingp) or by the primary/secondary insurer.
    sql_hint: "patient still owes: SUM(claims.outstandingp); insurers still owe: SUM(claims.outstanding1 + claims.outstanding2). Not claims_transactions.outstanding."
    db: billing

pii_columns:
  - patients.ssn
  - patients.drivers
  - patients.passport

join_keys:   # joins inside ONE database
  - encounters.patient = patients.id
  - claims_transactions.claimid = claims.id
  - claims.providerid = providers.id
  - providers.organization = organizations.id

# Joins ACROSS the two databases (clinical side first). The planner may only use these;
# code passes the ids from one database to the other.
links:
  - encounters.provider = providers.id
  - encounters.organization = organizations.id
  - encounters.payer = payers.id
  - medications.payer = payers.id
  - patients.id = claims.patientid
  - patients.id = payer_transitions.patient
  - patients.id = claims_transactions.patientid

# Totals computed across ALL patients. A patient must not see them (they describe other
# people), so in patient mode they are hidden from the AI and blocked by the safety check.
patient_hidden_columns:
  - payers.amount_covered
  - payers.amount_uncovered
  - payers.revenue
  - payers.covered_encounters
  - payers.uncovered_encounters
  - payers.covered_medications
  - payers.uncovered_medications
  - payers.covered_procedures
  - payers.uncovered_procedures
  - payers.covered_immunizations
  - payers.uncovered_immunizations
  - payers.unique_customers
  - payers.qols_avg
  - payers.member_months
  - organizations.revenue
  - organizations.utilization
  - providers.encounters
  - providers.procedures
