# Aether accuracy questions. Each one is scored by code (app/eval/scoring.py) — no AI judge.
# gold.sql runs with the ADMIN account at report time (the truth follows the data);
# :patient_id = the asking patient's id; :prev = the first column of the previous gold step.
# Field guide: see app/eval/cases.py.

# ---------------------------------------------------------------- clinical (PostgreSQL)
- id: CL01
  category: clinical
  role: clinician
  question: How many patients are alive?
  expect_route: sql
  gold: {db: clinical, sql: "SELECT count(*) FROM patients WHERE deathdate IS NULL"}

- id: CL02
  category: clinical
  role: clinician
  question: How many patients have died?
  expect_route: sql
  gold: {db: clinical, sql: "SELECT count(*) FROM patients WHERE deathdate IS NOT NULL"}

- id: CL03
  category: clinical
  role: clinician
  question: How many patients have hypertension?
  expect_route: sql
  gold: {db: clinical, sql: "SELECT count(DISTINCT patient) FROM conditions WHERE description = 'Essential hypertension (disorder)'"}

- id: CL04
  category: clinical
  role: clinician
  question: How many emergency visits were there?
  expect_route: sql
  gold: {db: clinical, sql: "SELECT count(*) FROM encounters WHERE encounterclass = 'emergency'"}

- id: CL05
  category: clinical
  role: clinician
  question: How many vaccines were given in 2020?
  expect_route: sql
  gold: {db: clinical, sql: "SELECT count(*) FROM immunizations WHERE date >= '2020-01-01' AND date < '2021-01-01'"}

- id: CL06
  category: clinical
  role: clinician
  question: Which patient has had the most visits? Give the name.
  expect_route: sql
  gold: {db: clinical, sql: "SELECT p.first || ' ' || p.last FROM encounters e JOIN patients p ON p.id = e.patient GROUP BY p.id, p.first, p.last ORDER BY count(*) DESC LIMIT 1"}

- id: CL07
  category: clinical
  role: clinician
  question: How many patients are allergic to peanuts?
  expect_route: sql
  gold: {db: clinical, sql: "SELECT count(DISTINCT patient) FROM allergies WHERE description ILIKE '%peanut%'"}

- id: CL08
  category: clinical
  role: clinician
  question: What is Angelyn934 Harris789's most recent HbA1c value?
  expect_route: sql
  gold: {db: clinical, sql: "SELECT o.value FROM observations o JOIN patients p ON p.id = o.patient WHERE p.first = 'Angelyn934' AND o.description = 'Hemoglobin A1c/Hemoglobin.total in Blood' ORDER BY o.date DESC LIMIT 1"}

- id: CL09
  category: clinical
  role: clinician
  question: How many female patients are there?
  expect_route: sql
  gold: {db: clinical, sql: "SELECT count(*) FROM patients WHERE gender = 'F'"}

- id: CL10
  category: clinical
  role: clinician
  question: Which diagnosis (disorder) affects the most patients?
  note: Asks for a disorder — the most common 'condition' row is an admin situation ("Medication review due").
  expect_route: sql
  gold: {db: clinical, sql: "SELECT regexp_replace(description, ' \\(.*\\)$', '') FROM conditions WHERE description LIKE '%(disorder)' GROUP BY description ORDER BY count(DISTINCT patient) DESC, description LIMIT 1"}

- id: CL11
  category: clinical
  role: clinician
  question: How many patients have diabetes?
  expect_route: sql
  gold: {db: clinical, sql: "SELECT count(DISTINCT patient) FROM conditions WHERE description ILIKE '%diabetes%' AND description NOT ILIKE 'prediabetes%'"}

- id: CL12
  category: clinical
  role: clinician
  question: What is the most commonly prescribed medication?
  expect_route: sql
  gold: {db: clinical, sql: "SELECT split_part(description, ' ', 1) FROM medications GROUP BY description ORDER BY count(*) DESC LIMIT 1"}

- id: CL13
  category: clinical
  role: clinician
  question: How many visits were there each year since 2010, and which year had the most?
  expect_route: sql
  gold: {db: clinical, sql: "SELECT count(*) FROM encounters WHERE start >= '2010-01-01' GROUP BY extract(year FROM start) ORDER BY count(*) DESC LIMIT 1"}
  note: >
    Added 2026-11-20. 17 yearly rows: the AI is shown only 10, so it once called 2018's 382 visits "the peak"
    (2021 had 502). Code now gives it the highest/lowest over all rows and checks peak/highest claims.

# ---------------------------------------------------------------- billing (MySQL)
- id: BI01
  category: billing
  role: clinician
  question: Which insurance company has the most customers?
  expect_route: sql
  gold: {db: billing, sql: "SELECT name FROM payers ORDER BY unique_customers DESC LIMIT 1"}

- id: BI02
  category: billing
  role: clinician
  question: How many hospitals or clinics are in Boston?
  expect_route: sql
  gold: {db: billing, sql: "SELECT count(*) FROM organizations WHERE city = 'Boston'"}

- id: BI03
  category: billing
  role: clinician
  question: How many doctors are in the system?
  expect_route: sql
  gold: {db: billing, sql: "SELECT count(*) FROM providers"}

- id: BI04
  category: billing
  role: clinician
  question: What is the total amount patients still owe on all claims?
  expect_route: sql
  gold: {db: billing, sql: "SELECT round(sum(outstandingp), 2) FROM claims"}

- id: BI05
  category: billing
  role: clinician
  question: Which insurance company has the highest revenue?
  expect_route: sql
  gold: {db: billing, sql: "SELECT name FROM payers ORDER BY revenue DESC LIMIT 1"}
  clarify_reply: The revenue figure recorded for each insurance company.

- id: BI06
  category: billing
  role: clinician
  question: Which medical speciality has the most providers?
  expect_route: sql
  gold: {db: billing, sql: "SELECT speciality FROM providers GROUP BY speciality ORDER BY count(*) DESC LIMIT 1"}

# ---------------------------------------------------------------- both databases
- id: XD01
  category: cross_db
  role: clinician
  question: Which doctor has seen the most patients? Give the doctor's name.
  expect_route: sql
  gold:
    db: clinical
    sql: "SELECT provider FROM encounters GROUP BY provider ORDER BY count(DISTINCT patient) DESC LIMIT 1"
    then: {db: billing, sql: "SELECT name FROM providers WHERE id IN :prev"}

- id: XD02
  category: cross_db
  role: clinician
  question: What is the total outstanding patient balance on claims for patients with diabetes?
  expect_route: sql
  gold:
    db: clinical
    sql: "SELECT DISTINCT patient FROM conditions WHERE description ILIKE '%diabetes%' AND description NOT ILIKE 'prediabetes%'"
    then: {db: billing, sql: "SELECT round(sum(outstandingp), 2) FROM claims WHERE patientid IN :prev"}

- id: XD03
  category: cross_db
  role: clinician
  question: Which insurance company paid for the most visits? Give its name.
  expect_route: sql
  gold:
    db: clinical
    sql: "SELECT payer FROM encounters GROUP BY payer ORDER BY count(*) DESC LIMIT 1"
    then: {db: billing, sql: "SELECT name FROM payers WHERE id IN :prev"}
  clarify_reply: The insurance company recorded as the payer of each visit.

- id: XD04
  category: cross_db
  role: clinician
  question: Which hospital or clinic had the most visits? Give its name.
  expect_route: sql
  gold:
    db: clinical
    sql: "SELECT organization FROM encounters GROUP BY organization ORDER BY count(*) DESC LIMIT 1"
    then: {db: billing, sql: "SELECT name FROM organizations WHERE id IN :prev"}

- id: XD05
  category: cross_db
  role: clinician
  question: What is the name of the doctor Angelyn934 Harris789 saw at her most recent visit?
  expect_route: sql
  gold:
    db: clinical
    sql: "SELECT e.provider FROM encounters e JOIN patients p ON p.id = e.patient WHERE p.first = 'Angelyn934' ORDER BY e.start DESC LIMIT 1"
    then: {db: billing, sql: "SELECT name FROM providers WHERE id IN :prev"}

- id: XD06
  category: cross_db
  role: clinician
  question: Which patient owes us the most money? Give the name and the amount.
  expect_route: sql
  gold:
    db: billing
    sql: "SELECT patientid FROM claims GROUP BY patientid ORDER BY sum(outstandingp) DESC LIMIT 1"
    then: {db: clinical, sql: "SELECT first, last FROM patients WHERE id IN :prev"}
  must_contain: [["2313.07", "2,313.07"]]
  clarify_reply: The patient with the largest outstanding balance on their claims.
  note: >
    Added 2026-11-19. The balance is in billing (claims.outstandingp), the name in clinical. A live run once had
    the name-lookup step invent its own "amount owed" (lifetime expenses minus coverage, 523,747.56) and rank by it.

- id: XD07
  category: cross_db
  role: clinician
  question: Which patient owes us the most? Give the top 5.
  expect_route: sql
  gold:
    db: billing
    sql: "SELECT patientid FROM claims GROUP BY patientid ORDER BY sum(outstandingp) DESC LIMIT 2"
    then: {db: clinical, sql: "SELECT first, last FROM patients WHERE id IN :prev"}
  must_contain: [["2313.07", "2,313.07"], ["211.38"], [tie, tied, same amount, equal]]
  must_not_contain: ["523747", "523,747"]
  note: >
    Added 2026-11-19 (the screenshot question). Top 2 are clear (2,313.07 and 211.38); after that at least five
    patients share 42.28, so an honest "top 5" mentions the tie.

# ---------------------------------------------------------------- FDA drug labels (RAG)
- id: RG01
  category: rag
  role: clinician
  question: What are the common side effects of metformin?
  expect_route: rag
  must_contain: [[diarrhea], [nausea, vomiting]]
  source_prefix: "openFDA label: Metformin"

- id: RG06
  category: rag
  role: clinician
  question: What are the side effects of metfromin?
  expect_kind: clarification
  expect_route: clarify
  must_contain: [[metformin]]
  note: >
    Added 2026-11-19. A misspelled medicine is never guessed: Aether asks "Did you mean metformin?" (Yes / No),
    found by trigram similarity in code — no extra AI call.

- id: RG02
  category: rag
  role: clinician
  question: What is lisinopril used for?
  expect_route: rag
  must_contain: [[hypertension, blood pressure]]
  source_prefix: "openFDA label: Lisinopril"

- id: RG03
  category: rag
  role: clinician
  question: What are the side effects of Ozempic?
  expect_route: rag
  must_contain: [["don't have", "do not have"]]
  note: Ozempic is not in the library — must say so, not invent.

- id: RG04
  category: rag
  role: clinician
  question: Can naproxen be taken together with lisinopril?
  expect_route: rag
  must_contain: [[kidney, renal, blood pressure, antihypertensive]]
  source_prefix: "openFDA label: Naproxen"

- id: RG05
  category: rag
  role: clinician
  question: Does amoxicillin have a boxed warning?
  expect_route: rag
  must_contain: [["has no", "does not have", "doesn't have", "no boxed warning"]]

