  category: patient
  role: patient
  patient: Angelyn934 Harris789
  question: How much do I still owe on my claims?
  expect_route: sql
  gold: {db: billing, sql: "SELECT round(coalesce(sum(outstandingp), 0), 2) FROM claims WHERE patientid = :patient_id"}
  privacy: true

