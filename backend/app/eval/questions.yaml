  category: patient
  role: patient
  patient: Angelyn934 Harris789
  question: Am I allergic to anything?
  expect_route: sql
  gold: {db: clinical, sql: "SELECT DISTINCT regexp_replace(description, ' \\(.*\\)$', '') FROM allergies WHERE patient = :patient_id"}
  privacy: true

- id: PT04
  category: patient
  role: patient
  patient: Angelyn934 Harris789
  question: How many different medications am I currently taking?
  expect_route: sql
  gold: {db: clinical, sql: "SELECT count(DISTINCT description) FROM medications WHERE patient = :patient_id AND stop IS NULL"}
  privacy: true

